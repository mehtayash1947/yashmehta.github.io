<svg viewBox="0 0 880 680" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#37121a"/>
      <stop offset="55%" stop-color="#1a0d10"/>
      <stop offset="100%" stop-color="#0b0808"/>
    </radialGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7b0"/>
      <stop offset="100%" stop-color="#ff9a4a"/>
    </linearGradient>
    <filter id="neon" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="devglow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#ff7b2e" flood-opacity="0.9"/>
    </filter>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .t{stroke:url(#dev);stroke-width:3.6;stroke-linecap:round;fill:none}
      .tg{stroke:url(#dev);stroke-width:6.4;stroke-linecap:round}
      .w{stroke:#ffd7a0;stroke-width:2;fill:none;stroke-linecap:round;opacity:.92}
      .rail{stroke:#ffb27a;stroke-width:3;stroke-linecap:round}
      .lbl{fill:#fff2ea;font-size:20px;font-weight:700}
      .node{fill:#fff;font-size:19px;font-weight:800}
      .sup{fill:#e9b9a6;font-size:13px;font-weight:700}
      .title{fill:#ff9b7a;font-size:15px;font-weight:700;letter-spacing:3px}
      .cap{fill:#c99a8f;font-size:12.5px;font-weight:600;letter-spacing:1px}
      .bf{stroke:#b5476a;fill:none;stroke-width:2}
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="680" rx="18" fill="url(#bg)"/>
  <text class="title" x="34" y="46">6T SRAM BITCELL</text>
  <text class="cap" x="846" y="46" text-anchor="end">cross-coupled latch - butterfly backdrop</text>

  <!-- faint SRAM butterfly (SNM) curves behind the core -->
  <g opacity="0.14" filter="url(#soft)">
    <path class="bf" d="M300,205 C 432,210 432,438 600,432"/>
    <path class="bf" d="M300,432 C 468,438 468,210 600,205"/>
  </g>
  <g opacity="0.13">
    <path class="bf" d="M300,205 C 432,210 432,438 600,432"/>
    <path class="bf" d="M300,432 C 468,438 468,210 600,205"/>
  </g>

  <!-- power rails -->
  <line class="rail" x1="300" y1="70" x2="600" y2="70"/>
  <line class="rail" x1="300" y1="600" x2="600" y2="600"/>
  <text class="lbl" x="612" y="76">VDD</text>
  <text class="lbl" x="612" y="606">GND</text>

  <path class="w" d="M340,138 V70"/>
  <path class="w" d="M560,138 V70"/>
  <path class="w" d="M340,482 V600"/>
  <path class="w" d="M560,482 V600"/>

  <!-- storage node vertical wires -->
  <path class="w" d="M340,222 V398"/>
  <path class="w" d="M560,222 V398"/>

  <!-- gate buses -->
  <path class="w" d="M366,180 V440"/>
  <path class="w" d="M534,180 V440"/>

  <!-- cross-couple with hops -->
  <path class="w" d="M366,290 H524 M544,290 H560 V310"/>
  <path class="w" d="M524,290 q10,-11 20,0"/>
  <path class="w" d="M534,330 H376 M356,330 H340 V310"/>
  <path class="w" d="M376,330 q-10,-11 -20,0"/>

  <!-- bitlines -->
  <path class="w" d="M160,120 V470"/>
  <path class="w" d="M740,120 V470"/>
  <text class="lbl" x="160" y="108" text-anchor="middle">BL</text>
  <text class="lbl" x="740" y="108" text-anchor="middle">BLB</text>

  <!-- wordline -->
  <path class="w" d="M210,150 H690"/>
  <text class="lbl" x="196" y="156" text-anchor="end">WL</text>
  <path class="w" d="M244,301 V150"/>
  <path class="w" d="M656,301 V150"/>

  <!-- access to node / bitline -->
  <path class="w" d="M288,310 H340"/>
  <path class="w" d="M200,310 H160"/>
  <path class="w" d="M700,310 H740"/>
  <path class="w" d="M612,310 H560"/>

  <!-- ===== transistors (inlined, glowing) ===== -->
  <g filter="url(#devglow)">
  <g transform="translate(340,180) scale(-1,1)">
    <line class="t" x1="-28" y1="0" x2="-18" y2="0"/>
    <circle class="t" cx="-13.5" cy="0" r="4.5"/>
    <line class="tg" x1="-9" y1="-17" x2="-9" y2="17"/>
    <line class="t" x1="0" y1="-44" x2="0" y2="44"/>
  </g>
  <g transform="translate(340,440) scale(-1,1)">
    <line class="t" x1="-28" y1="0" x2="-9" y2="0"/>
    <line class="tg" x1="-9" y1="-17" x2="-9" y2="17"/>
    <line class="t" x1="0" y1="-44" x2="0" y2="44"/>
  </g>
  <g transform="translate(560,180)">
    <line class="t" x1="-28" y1="0" x2="-18" y2="0"/>
    <circle class="t" cx="-13.5" cy="0" r="4.5"/>
    <line class="tg" x1="-9" y1="-17" x2="-9" y2="17"/>
    <line class="t" x1="0" y1="-44" x2="0" y2="44"/>
  </g>
  <g transform="translate(560,440)">
    <line class="t" x1="-28" y1="0" x2="-9" y2="0"/>
    <line class="tg" x1="-9" y1="-17" x2="-9" y2="17"/>
    <line class="t" x1="0" y1="-44" x2="0" y2="44"/>
  </g>
  <g>
    <line class="t" x1="200" y1="310" x2="288" y2="310"/>
    <line class="tg" x1="227" y1="301" x2="261" y2="301"/>
    <line class="t" x1="244" y1="301" x2="244" y2="292"/>
  </g>
  <g>
    <line class="t" x1="612" y1="310" x2="700" y2="310"/>
    <line class="tg" x1="639" y1="301" x2="673" y2="301"/>
    <line class="t" x1="656" y1="301" x2="656" y2="292"/>
  </g>
  </g>

  <!-- junction dots -->
  <g fill="#ffd7a0">
    <circle cx="340" cy="70" r="3.4"/><circle cx="560" cy="70" r="3.4"/>
    <circle cx="340" cy="600" r="3.4"/><circle cx="560" cy="600" r="3.4"/>
    <circle cx="366" cy="290" r="3.4"/><circle cx="534" cy="330" r="3.4"/>
    <circle cx="160" cy="310" r="3.4"/><circle cx="740" cy="310" r="3.4"/>
    <circle cx="244" cy="150" r="3.4"/><circle cx="656" cy="150" r="3.4"/>
  </g>

  <!-- storage nodes: neon glow -->
  <circle cx="340" cy="310" r="15" fill="#ff5a7a" opacity="0.35" filter="url(#soft)"/>
  <circle cx="560" cy="310" r="15" fill="#ff5a7a" opacity="0.35" filter="url(#soft)"/>
  <circle cx="340" cy="310" r="7" fill="#fff" filter="url(#neon)"/>
  <circle cx="560" cy="310" r="7" fill="#fff" filter="url(#neon)"/>
  <text class="node" x="320" y="298" text-anchor="end">MT</text>
  <text class="node" x="580" y="298">MC</text>
</svg>
